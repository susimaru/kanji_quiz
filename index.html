<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部首名マスター 3級</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=M+PLUS+1p:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e; --red: #c0392b; --gold: #d4a017; --gold-light: #f9e6a0; --gold-dark: #8a6800;
            --paper: #fdf6e3; --paper-dark: #f0e6c8; --paper-darker: #e0d0a0; --green: #27ae60;
            --green-light: #eafaf1; --red-light: #fdecea; --blue: #2980b9; --blue-light: #eaf4fb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'M PLUS 1p', sans-serif; background: var(--ink);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(100,80,20,0.3) 0%, transparent 60%);
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px 12px;
        }
        #app { width: 100%; max-width: 520px; }
        #start-screen, #main-card, #result-screen {
            background: var(--paper); border-radius: 16px; border: 3px solid var(--gold);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden;
        }
        #start-screen { padding: 48px 32px; text-align: center; }
        #main-card { display: none; flex-direction: column; }
        #main-card.visible { display: flex; }
        #result-screen { display: none; padding: 40px 32px; text-align: center; }
        .start-title { font-family: 'Noto Serif JP', serif; font-size: 1.8rem; font-weight: 900; margin-bottom: 20px; }
        .start-btn { padding: 16px 48px; background: var(--ink); color: var(--gold); border: 2px solid var(--gold); border-radius: 8px; font-weight: 700; cursor: pointer; }
        .top-bar { background: var(--ink); padding: 12px 20px; display: flex; justify-content: space-between; color: var(--gold); border-bottom: 3px solid var(--gold); }
        .mode-tabs { display: flex; background: var(--paper-dark); }
        .mode-tab { flex: 1; padding: 10px; border: none; font-weight: 700; color: #888; cursor: pointer; background: none; outline: none; }
        .mode-tab.active { color: var(--ink); background: var(--paper); border-bottom: 3px solid var(--ink); }
        .question-area { padding: 24px; text-align: center; }
        .bushu-char { font-family: 'Noto Serif JP', serif; font-size: 100px; font-weight: 900; color: var(--ink); margin-bottom: 10px; }
        .hint-box { background: var(--blue-light); border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 0.9rem; }
        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 24px 24px; }
        .choice-btn { padding: 14px; background: white; border: 2px solid var(--paper-darker); border-radius: 10px; font-weight: 700; color: var(--ink); cursor: pointer; }
        .input-row { display: flex; gap: 8px; padding: 0 24px 24px; }
        .answer-input { flex: 1; padding: 12px; border: 2px solid var(--paper-darker); border-radius: 10px; text-align: center; font-size: 1.1rem; }
        .submit-btn { padding: 12px 20px; background: var(--ink); color: var(--gold); border: 2px solid var(--gold); border-radius: 10px; font-weight: 700; }
        .result-row { min-height: 40px; text-align: center; font-weight: 700; margin-bottom: 10px; padding: 0 20px; }
        .next-btn { width: 90%; margin: 0 auto 20px; padding: 15px; background: var(--ink); color: white; border-radius: 10px; font-weight: 700; display: none; cursor: pointer; border: none; }
        .progress-bar { height: 6px; background: var(--gold); width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<div id="app">
    <div id="start-screen">
        <h1 class="start-title">部首名マスター 3級</h1>
        <button class="start-btn" onclick="initApp()">学習を始める</button>
        <p style="font-size: 0.75rem; color: #999; margin-top: 15px;">Copyright n.seo</p>
    </div>

    <div id="main-card">
        <div class="top-bar">
            <span>部首名マスター</span>
            <div id="stats">Score: 0 | 🔥 0</div>
        </div>
        <div class="mode-tabs">
            <button class="mode-tab active" id="tab-beginner" onclick="setMode('beginner')">初級(4択)</button>
            <button class="mode-tab" id="tab-advanced" onclick="setMode('advanced')">応用(入力)</button>
        </div>
        <div class="progress-bar" id="progress-bar"></div>
        <div class="question-area">
            <div id="stroke-info" style="color:var(--gold-dark); font-weight:bold;"></div>
            <div class="bushu-char" id="bushu-char"></div>
            <div class="hint-box" id="hint-text"></div>
        </div>
        <div id="beginner-ui" class="choices-grid"></div>
        <div id="advanced-ui" style="display:none;" class="input-row">
            <input type="text" id="answer-input" placeholder="かな入力" autocomplete="off">
            <button class="submit-btn" onclick="checkAdvanced()">回答</button>
        </div>
        <div class="result-row" id="result-message"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次へ →</button>
    </div>

    <div id="result-screen">
        <h2 id="final-score" style="font-size:3rem;"></h2>
        <button class="start-btn" onclick="location.reload()">もう一度</button>
    </div>
</div>

const seikaiSound = new Audio('seikai.wav');
const hazureSound = new Audio('hazure.wav');

let mode = 'beginner', currentQ = null, score = 0, streak = 0, questionsDone = 0;
const SESSION_COUNT = 10;
let sessionPool = [];

function initApp() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('main-card').classList.add('visible');
    // 音声ファイルの事前ロード
    seikaiSound.load(); hazureSound.load();
    startSession();
}

function startSession() {
    score = 0; streak = 0; questionsDone = 0;
    sessionPool = [...bushuData].sort(() => Math.random() - 0.5).slice(0, SESSION_COUNT);
    updateStats(); nextQuestion();
}

function setMode(m) {
    mode = m;
    document.getElementById('tab-beginner').classList.toggle('active', m==='beginner');
    document.getElementById('tab-advanced').classList.toggle('active', m==='advanced');
    document.getElementById('beginner-ui').style.display = m==='beginner' ? 'grid' : 'none';
    document.getElementById('advanced-ui').style.display = m==='advanced' ? 'flex' : 'none';
    nextQuestion();
}

function nextQuestion() {
    if (questionsDone >= SESSION_COUNT) { showResultScreen(); return; }
    currentQ = sessionPool[questionsDone];
    document.getElementById('bushu-char').innerText = currentQ.char;
    document.getElementById('stroke-info').innerText = currentQ.strokes + '画';
    document.getElementById('hint-text').innerText = 'ヒント：' + (Array.isArray(currentQ.samples) ? currentQ.samples.join('・') : currentQ.samples);
    document.getElementById('result-message').innerText = '';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('progress-bar').style.width = (questionsDone / SESSION_COUNT * 100) + '%';
    
    if (mode === 'beginner') {
        const ui = document.getElementById('beginner-ui'); ui.innerHTML = '';
        [...currentQ.choices].sort(() => Math.random() - 0.5).forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn'; btn.innerText = c;
            btn.onclick = () => checkAnswer(c);
            ui.appendChild(btn);
        });
    } else {
        document.getElementById('answer-input').value = '';
    }
}

function checkAdvanced() {
    const val = document.getElementById('answer-input').value.trim();
    if (!val) return; checkAnswer(val);
}

function checkAnswer(ans) {
    if (document.getElementById('next-btn').style.display === 'block') return;
    const isCorrect = Array.isArray(currentQ.name) ? currentQ.name.includes(ans) : currentQ.name === ans;
    questionsDone++;
    const msg = document.getElementById('result-message');
    if (isCorrect) {
        score += 10; streak++;
        msg.innerText = '⭕ 正解！'; msg.style.color = 'var(--green)';
        seikaiSound.currentTime = 0; seikaiSound.play().catch(e => console.log(e));
    } else {
        streak = 0;
        const n = Array.isArray(currentQ.name) ? currentQ.name[0] : currentQ.name;
        msg.innerText = '❌ 不正解！正解は：' + n; msg.style.color = 'var(--red)';
        hazureSound.currentTime = 0; hazureSound.play().catch(e => console.log(e));
    }
    updateStats();
    document.getElementById('next-btn').style.display = 'block';
}

function updateStats() {
    document.getElementById('stats').innerText = `Score: ${score} | 🔥 ${streak}`;
}

function showResultScreen() {
    document.getElementById('main-card').classList.remove('visible');
    const rs = document.getElementById('result-screen');
    rs.style.display = 'block';
    document.getElementById('final-score').innerText = score + '点';
}
</script>
</body>
</html>
