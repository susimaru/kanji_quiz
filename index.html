<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部首名マスター 3級</title>
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=M+PLUS+1p:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e;
            --red: #c0392b;
            --gold: #d4a017;
            --gold-light: #f9e6a0;
            --gold-dark: #8a6800;
            --paper: #fdf6e3;
            --paper-dark: #f0e6c8;
            --paper-darker: #e0d0a0;
            --green: #27ae60;
            --green-light: #eafaf1;
            --red-light: #fdecea;
            --blue: #2980b9;
            --blue-light: #eaf4fb;
            --shadow: rgba(0,0,0,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'M PLUS 1p', sans-serif;
            background: var(--ink);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(100,80,20,0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(60,40,10,0.4) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 12px;
        }

        #app {
            width: 100%;
            max-width: 520px;
            position: relative;
        }

        /* ===== START SCREEN ===== */
        #start-screen {
            background: var(--paper);
            border-radius: 16px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 3px solid var(--gold);
            position: relative;
            overflow: hidden;
        }
        #start-screen::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
        }
        .start-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--ink);
            margin-bottom: 8px;
            letter-spacing: 0.1em;
        }
        .start-subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 32px;
        }
        .start-kanji-deco {
            font-family: 'Noto Serif JP', serif;
            font-size: 5rem;
            font-weight: 900;
            color: var(--paper-dark);
            margin: 16px 0;
            letter-spacing: 0.2em;
            line-height: 1;
            user-select: none;
        }
        .start-btn {
            display: inline-block;
            padding: 16px 48px;
            background: var(--ink);
            color: var(--gold);
            font-family: 'M PLUS 1p', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            border: 2px solid var(--gold);
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: all 0.2s;
            outline: none;
        }
        .start-btn:hover { background: #2d2d50; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .start-note { font-size: 0.75rem; color: #999; margin-top: 20px; }

        /* ===== MAIN CARD ===== */
        #main-card {
            background: var(--paper);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 3px solid var(--gold);
            overflow: hidden;
            display: none;
            flex-direction: column;
        }
        #main-card.visible { display: flex; }

        .top-bar {
            background: var(--ink);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
        }
        .app-title-bar {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.05em;
        }
        .stats-row {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.6rem; color: rgba(212,160,23,0.7); letter-spacing: 0.05em; }
        .stat-value { font-size: 1rem; font-weight: 700; color: var(--gold); }
        .streak-display { display: flex; align-items: center; gap: 4px; }
        .streak-num { font-size: 1rem; font-weight: 700; color: #ff9944; }

        .mode-tabs { display: flex; background: var(--paper-dark); border-bottom: 2px solid var(--paper-darker); }
        .mode-tab {
            flex: 1; padding: 10px; background: none; border: none;
            font-family: 'M PLUS 1p', sans-serif; font-size: 0.85rem; font-weight: 700;
            color: #888; cursor: pointer; border-bottom: 3px solid transparent;
            margin-bottom: -2px; transition: all 0.2s; outline: none;
        }
        .mode-tab.active { color: var(--ink); border-bottom-color: var(--ink); background: var(--paper); }

        .progress-wrap { background: var(--paper-dark); height: 6px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); transition: width 0.4s ease; }

        .question-area { padding: 24px 24px 16px; }
        .bushu-stage { text-align: center; margin: 0 0 16px; }
        .category-badge {
            display: inline-block; font-size: 0.7rem; background: var(--gold-light);
            color: var(--gold-dark); border: 1px solid var(--gold); border-radius: 20px;
            padding: 2px 12px; margin-bottom: 8px; font-weight: 700;
        }
        .bushu-char {
            font-family: 'Noto Serif JP', serif; font-size: 90px; font-weight: 900;
            color: var(--ink); line-height: 1.1; display: block; transition: all 0.3s;
        }
        .bushu-char.shake { animation: shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
        .bushu-char.pop { animation: pop 0.3s ease; }
        @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .hint-box {
            background: var(--blue-light); border: 1px solid #b3d7ef; border-radius: 8px;
            padding: 10px 16px; font-size: 0.85rem; color: #1a5276; margin-bottom: 16px; text-align: center;
        }

        .answer-area { padding: 0 24px 24px; }
        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .choice-btn {
            padding: 14px 8px; background: white; border: 2px solid var(--paper-darker);
            border-radius: 10px; font-family: 'M PLUS 1p', sans-serif; font-size: 1rem;
            font-weight: 700; color: var(--ink); cursor: pointer; transition: all 0.15s;
        }
        .choice-btn.correct { background: var(--green-light); border-color: var(--green); color: var(--green); }
        .choice-btn.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); }

        .input-row { display: flex; gap: 8px; }
        .answer-input {
            flex: 1; padding: 12px 16px; font-family: 'M PLUS 1p', sans-serif;
            font-size: 1rem; border: 2px solid var(--paper-darker); border-radius: 10px; outline: none;
        }
        .submit-btn {
            padding: 12px 20px; background: var(--ink); color: var(--gold);
            border: 2px solid var(--gold); border-radius: 10px; font-weight: 700; cursor: pointer;
        }

        .result-row { display: flex; align-items: center; justify-content: center; min-height: 36px; margin-top: 12px; font-weight: 700; }
        .result-correct { color: var(--green); }
        .result-wrong { color: var(--red); }

        .next-btn {
            display: block; width: 100%; margin-top: 12px; padding: 14px;
            background: var(--ink); color: white; border: none; border-radius: 10px;
            font-weight: 700; cursor: pointer;
        }

        /* ===== RESULT SCREEN ===== */
        #result-screen {
            background: var(--paper); border-radius: 16px; padding: 40px 32px;
            text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 3px solid var(--gold); display: none;
        }
        .result-score-big { font-size: 4rem; font-weight: 900; color: var(--gold-dark); line-height: 1; }

        .confetti-piece {
            position: fixed; width: 8px; height: 8px; top: -10px;
            animation: confetti-fall linear forwards; border-radius: 2px; pointer-events: none; z-index: 9999;
        }
        @keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

<div id="app">
    <div id="start-screen">
        <div class="start-kanji-deco">部首</div>
        <div class="start-title">部首名マスター</div>
        <div class="start-subtitle">硬筆書写検定3級 理論対策</div>
        <button class="start-btn" onclick="initApp()">学習を始める</button>
        <div class="start-note">✦ 正解すると「seikai.wav」が再生されます</div>
    </div>

    <div id="main-card">
        <div class="top-bar">
            <div class="app-title-bar">部首名マスター</div>
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-label">スコア</div>
                    <div class="stat-value" id="score-display">0</div>
                </div>
                <div class="streak-display">
                    <span class="flame">🔥</span>
                    <span class="streak-num" id="streak-display">0</span>
                </div>
            </div>
        </div>

        <div class="mode-tabs">
            <button class="mode-tab active" id="tab-beginner" onclick="setMode('beginner')">🎯 初級</button>
            <button class="mode-tab" id="tab-advanced" onclick="setMode('advanced')">✏️ 応用</button>
            <button class="mode-tab" id="tab-review" onclick="setMode('review')">📋 復習</button>
        </div>

        <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar" style="width:0%"></div>
        </div>

        <div class="question-area">
            <div class="bushu-stage">
                <div class="category-badge" id="category-badge">べん・つくり</div>
                <div class="bushu-char" id="bushu-char">亻</div>
                <div class="stroke-badge" id="stroke-info">2画</div>
            </div>
            <div class="hint-box">
                <div id="hint-text">休・代・仕</div>
            </div>
        </div>

        <div class="answer-area">
            <div id="beginner-ui" class="choices-grid"></div>
            <div id="advanced-ui" style="display:none;">
                <div class="input-row">
                    <input class="answer-input" type="text" id="answer-input" placeholder="ひらがな" autocomplete="off">
                    <button class="submit-btn" onclick="checkAdvanced()">回答</button>
                </div>
            </div>
            <div id="review-ui" style="display:none;"><div id="review-list"></div></div>
            <div class="result-row" id="result-message"></div>
            <button class="next-btn" id="next-btn" style="display:none;" onclick="nextQuestion()">次へ →</button>
        </div>
    </div>

    <div id="result-screen">
        <div class="result-score-big" id="final-score">0%</div>
        <div id="final-grade" style="margin:20px 0; font-weight:700;"></div>
        <button class="start-btn" onclick="startSession()">リトライ</button>
    </div>
</div>

<script>
const bushuData = [
    { char:"亻", name:"にんべん", strokes:2, category:"へん", samples:"休・代・仕", choices:["にんべん","ぎょうにんべん","いとにょう","ひとあし"] },
    { char:"氵", name:"さんずい", strokes:3, category:"へん", samples:"海・泳・池", choices:["さんずい","にすい","したみず","うかんむり"] },
    { char:"忄", name:"りっしんべん", strokes:3, category:"へん", samples:"忙・情・快", choices:["りっしんべん","にんべん","したごころ","きへん"] },
    { char:"彳", name:"ぎょうにんべん", strokes:3, category:"へん", samples:"行・役・復", choices:["ぎょうにんべん","にんべん","しんにゅう","いとへん"] },
    { char:"⺭", name:"しめすへん", strokes:4, category:"へん", samples:"神・社・福", choices:["しめすへん","ころもへん","のぎへん","けものへん"] },
    { char:"⻂", name:"ころもへん", strokes:5, category:"へん", samples:"初・被・複", choices:["ころもへん","しめすへん","さんずい","ゆきへん"] },
    { char:"禾", name:"のぎへん", strokes:5, category:"へん", samples:"秋・私・和", choices:["のぎへん","きへん","かねへん","こめへん"] },
    { char:"⻌", name:["しんにゅう","しんにょう"], strokes:3, category:"にょう", samples:"道・進・運", choices:["しんにゅう","えんにょう","いとにょう","そうにょう"] },
    { char:"門", name:"もんがまえ", strokes:8, category:"かまえ", samples:"開・閉・問", choices:["もんがまえ","くにがまえ","しかばね","つつみがまえ"] },
    { char:"戈", name:"たすき", strokes:4, category:"その他", samples:"成・戦・浅", choices:["たすき","ほこづくり","れっか","さんずい"] }
];

// ───── Audio 設定 ─────
const seikaiSound = new Audio('seikai.wav');

function playSeikai() {
    seikaiSound.currentTime = 0;
    seikaiSound.play().catch(e => console.log("再生エラー:", e));
}

let mode = 'beginner';
let currentQ = null;
let score = 0;
let correctCount = 0;
let streak = 0;
let questionsDone = 0;
const SESSION_LENGTH = 10;
let sessionWrongs = [];
let sessionPool = [];

function initApp() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('main-card').classList.add('visible');
    // iOSの音声ロック解除
    seikaiSound.load();
    startSession();
}

function startSession() {
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('main-card').classList.add('visible');
    score = 0; correctCount = 0; streak = 0; questionsDone = 0; sessionWrongs = [];
    sessionPool = [...bushuData].sort(() => Math.random() - 0.5).slice(0, SESSION_LENGTH);
    updateStats();
    nextQuestion();
}

function setMode(m) {
    mode = m;
    ['beginner','advanced','review'].forEach(id => document.getElementById('tab-'+id).classList.toggle('active', id === m));
    ['beginner-ui','advanced-ui','review-ui'].forEach(id => document.getElementById(id).style.display = 'none');
    document.getElementById(m+'-ui').style.display = m === 'beginner' ? 'grid' : 'block';
    if (m === 'review') showReview(); else nextQuestion();
}

function isCorrectAnswer(q, ans) {
    return Array.isArray(q.name) ? q.name.includes(ans) : q.name === ans;
}

function nextQuestion() {
    if (questionsDone >= SESSION_LENGTH) { showResultScreen(); return; }
    currentQ = sessionPool[questionsDone];
    document.getElementById('result-message').innerHTML = '';
    document.getElementById('next-btn').style.display = 'none';
    if (document.getElementById('answer-input')) document.getElementById('answer-input').value = '';

    document.getElementById('bushu-char').innerText = currentQ.char;
    document.getElementById('stroke-info').innerText = currentQ.strokes + '画';
    document.getElementById('category-badge').innerText = currentQ.category;
    document.getElementById('hint-text').innerText = currentQ.samples;
    document.getElementById('progress-bar').style.width = (questionsDone / SESSION_LENGTH * 100) + '%';

    if (mode === 'beginner') {
        const ui = document.getElementById('beginner-ui');
        ui.innerHTML = '';
        [...currentQ.choices].sort(() => Math.random() - 0.5).forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice;
            btn.onclick = () => {
                const correct = isCorrectAnswer(currentQ, choice);
                ui.querySelectorAll('button').forEach(b => {
                    b.disabled = true;
                    if (isCorrectAnswer(currentQ, b.innerText)) b.classList.add('correct');
                });
                if (!correct) btn.classList.add('wrong');
                showResult(correct);
            };
            ui.appendChild(btn);
        });
    }
}

function checkAdvanced() {
    const val = document.getElementById('answer-input').value.trim();
    if (!val) return;
    showResult(isCorrectAnswer(currentQ, val));
}

function showResult(correct) {
    questionsDone++;
    const msg = document.getElementById('result-message');
    if (correct) {
        correctCount++; streak++; score += 10;
        msg.innerHTML = '<span class="result-correct">✓ 正解！</span>';
        document.getElementById('bushu-char').classList.add('pop');
        playSeikai(); // ★ここでwav再生
        if (streak >= 3) launchConfetti();
    } else {
        streak = 0; sessionWrongs.push(currentQ);
        const name = Array.isArray(currentQ.name) ? currentQ.name[0] : currentQ.name;
        msg.innerHTML = `<span class="result-wrong">✗ 正解：「${name}」</span>`;
        document.getElementById('bushu-char').classList.add('shake');
    }
    updateStats();
    document.getElementById('next-btn').style.display = 'block';
    setTimeout(() => document.getElementById('bushu-char').classList.remove('pop', 'shake'), 500);
}

function updateStats() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('streak-display').innerText = streak;
}

function showReview() {
    const el = document.getElementById('review-list');
    el.innerHTML = sessionWrongs.length ? '' : '<p style="text-align:center;padding:20px;color:#888;">間違いはありません！</p>';
    sessionWrongs.forEach(q => {
        const d = document.createElement('div');
        d.style.cssText = 'display:flex;align-items:center;gap:15px;padding:10px;background:white;margin-bottom:5px;border-radius:8px;';
        d.innerHTML = `<span style="font-size:2rem;font-weight:900;">${q.char}</span><span>${Array.isArray(q.name)?q.name[0]:q.name}</span>`;
        el.appendChild(d);
    });
}

function showResultScreen() {
    document.getElementById('main-card').classList.remove('visible');
    document.getElementById('result-screen').style.display = 'block';
    const pct = Math.round(correctCount / SESSION_LENGTH * 100);
    document.getElementById('final-score').innerText = pct + '%';
    document.getElementById('final-grade').innerText = pct >= 80 ? '🏆 素晴らしい成績です！' : '📖 復習して次も頑張りましょう！';
}

function launchConfetti() {
    for (let i = 0; i < 30; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = ['#d4a017','#c0392b','#27ae60'][Math.floor(Math.random()*3)];
        el.style.animationDuration = (1 + Math.random() * 2) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
    }
}
</script>
</body>
</html>
